# nodeos history node with direct ingestion into Roborovski core storage.
# Start from a snapshot the first time: nodeos --data-dir /data/nodeos --config-dir /etc/nodeos --snapshot <file>

plugin = eosio::chain_plugin
plugin = eosio::chain_api_plugin
plugin = eosio::http_plugin
plugin = eosio::net_plugin
plugin = eosio::resource_monitor_plugin
plugin = eosio::roborovski_writer_plugin

read-mode = head
chain-state-db-size-mb = 65536
p2p-accept-transactions = false
api-accept-transactions = false

http-server-address = http-category-address
http-category-address = chain_ro,127.0.0.1:8888
http-category-address = prometheus,127.0.0.1:9600

roborovski-writer-dir = /data/roborovski/core
roborovski-writer-abi-dir = /data/roborovski/core/abis
roborovski-writer-buffer-dir = /data/roborovski/core/buffer
roborovski-writer-headroom-mb = 4096
roborovski-writer-buffer-limit-mb = 16384

p2p-peer-address = <peer host>:9876
